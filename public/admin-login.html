<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Queue - Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="auth-admin">
<div class="auth-wrap">
  <div class="card auth-card p-4">
    <h3 class="text-center mb-1">Admin Panel</h3>
    <p class="text-center text-muted mb-4">Staff login only</p>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Admin Email</label>
        <input type="email" id="email" class="form-control" placeholder="admin@queue.com">
        <div class="invalid-feedback">Enter a valid email address.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control">
        <div class="invalid-feedback">Password is required.</div>
      </div>
      <button class="btn btn-dark w-100">Login as Admin</button>
    </form>
    <div id="msg" class="mt-3"></div>
    <p class="text-center small mt-2 mb-0"><a href="login.html">Back to user login</a></p>
  </div>
</div>
<script src="auth.js"></script>
<script>setupLogin("/api/auth/admin-login", "/admin.html");</script>
</body>
</html>
