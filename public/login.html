<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Queue - User Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card p-4">
    <h3 class="text-center text-primary mb-1">Digital Queue System</h3>
    <p class="text-center text-muted mb-4">User Login</p>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Email or mobile number</label>
        <input type="text" id="identifier" class="form-control" autocomplete="username" placeholder="you@example.com or 10-digit mobile">
        <div class="invalid-feedback">Enter a valid email address or 10-digit mobile number.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control">
        <div class="invalid-feedback">Password is required.</div>
      </div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <div id="msg" class="mt-3"></div>
    <p class="text-center mt-2 mb-1">New user? <a href="register.html">Create an account</a></p>
    <p class="text-center small mb-0"><a href="admin-login.html" class="text-muted">Admin login</a></p>
  </div>
</div>
<script src="auth.js"></script>
<script>setupLogin("/api/auth/login", "/user.html", { allowPhone: true });</script>
</body>
</html>
