<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Queue - My Tokens</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand">Digital Queue System</span>
    <div class="d-flex align-items-center gap-3">
      <span class="text-white">Hi, <b id="userName"></b><small class="d-block" id="userContact"></small></span>
      <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row g-4">
    <div class="col-md-5">
      <div class="card p-4 mb-4 text-center">
        <h6 class="text-muted">NOW SERVING</h6>
        <div class="big-number" id="nowServing">--</div>
      </div>
      <div class="card p-4">
        <h4 class="mb-3">Book a Token</h4>
        <form id="tokenForm" novalidate>
          <div class="mb-3">
            <label class="form-label">Service</label>
            <select id="service" class="form-select">
              <option value="">-- Select service --</option>
              <option>General Enquiry</option>
              <option>Billing</option>
              <option>Account Opening</option>
              <option>Complaint</option>
            </select>
            <div class="invalid-feedback">Please choose a service.</div>
          </div>
          <button class="btn btn-primary w-100">Get Token</button>
        </form>
        <div id="msg" class="mt-3"></div>
      </div>
    </div>

    <div class="col-md-7">
      <div class="card p-4">
        <h4 class="mb-3">My Tokens Today</h4>
        <div id="myTokens"></div>
      </div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script src="user.js"></script>
</body>
</html>
