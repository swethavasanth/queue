<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Queue - Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card p-4">
    <h3 class="text-center text-primary mb-1">Create Account</h3>
    <p class="text-center text-muted mb-4">Register to book tokens online</p>
    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="e.g. Ravi Kumar">
        <div class="invalid-feedback">Name must be 3-30 letters (no numbers or symbols).</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com">
        <div class="invalid-feedback">Enter a valid email address.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="text" id="phone" class="form-control" maxlength="10" placeholder="10-digit mobile number">
        <div class="invalid-feedback">Enter a valid 10-digit number starting with 6-9.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control">
        <div class="invalid-feedback">At least 6 characters with a letter and a number.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" id="confirm" class="form-control">
        <div class="invalid-feedback">Passwords do not match.</div>
      </div>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <div id="msg" class="mt-3"></div>
    <p class="text-center mt-2 mb-0">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>
<script src="auth.js"></script>
<script>setupRegister();</script>
</body>
</html>
