<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Queue - Get Token</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand">Digital Queue System</span>
    <div>
      <a href="index.html" class="btn btn-light btn-sm">Get Token</a>
      <a href="admin.html" class="btn btn-outline-light btn-sm">Admin</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row g-4">
    <!-- Book token -->
    <div class="col-md-6">
      <div class="card p-4">
        <h4 class="mb-3">Book a Token</h4>
        <form id="tokenForm" novalidate>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="e.g. Ravi Kumar">
            <div class="invalid-feedback">Name must be 3-30 letters (no numbers or symbols).</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" id="phone" class="form-control" maxlength="10" placeholder="10-digit mobile number">
            <div class="invalid-feedback">Enter a valid 10-digit number starting with 6-9.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Service</label>
            <select id="service" class="form-select">
              <option value="">-- Select service --</option>
              <option>General Enquiry</option>
              <option>Billing</option>
              <option>Account Opening</option>
              <option>Complaint</option>
            </select>
            <div class="invalid-feedback">Please choose a service.</div>
          </div>
          <button class="btn btn-primary w-100">Get Token</button>
        </form>
        <div id="bookResult" class="mt-3"></div>
      </div>
    </div>

    <!-- Check status -->
    <div class="col-md-6">
      <div class="card p-4">
        <h4 class="mb-3">Check Token Status</h4>
        <form id="statusForm" novalidate class="d-flex gap-2">
          <input type="number" id="checkNumber" class="form-control" placeholder="Token number" min="1">
          <button class="btn btn-success">Check</button>
        </form>
        <div id="statusResult" class="mt-3"></div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
